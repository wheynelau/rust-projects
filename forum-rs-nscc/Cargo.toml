[package]
name = "forum-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "clean-reddit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.4", features = ["derive"] }
lazy_static = "1.4.0"
petgraph = "0.6.5"
rayon = "1.10.0"
regex = "1.10.4"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
tokenizers = { version = "0.20.1", features = ["hf-hub", "http"] }
